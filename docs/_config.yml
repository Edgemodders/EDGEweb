# GitHub Pages (Jekyll) settings for edgemodders.ai.
# index.html is a standalone landing page and is served as-is.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# Built and deployed by .github/workflows/pages.yml. The custom domain is set in Settings > Pages.

title: EDGEmodders
url: https://edgemodders.ai
baseurl: ""
repo: https://github.com/Edgemodders/EDGEweb
# Community Discord invite. index.html and platform.html hard-code the same URL: update all three together.
discord: https://discord.gg/63qP3Erw43

# Screenshots waiting to be checked are never published.
exclude:
  - assets/shots/inbox

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "wiki"
    values:
      layout: wiki

# Wiki sidebar groups, in order. Each wiki page sets `section` to one of these and `order` within it.
wiki_sections:
  - Start here
  - REDagent
  - REDnode
  - REDcode
  - REDdeck
  - REDbridge

# Status bar links, in order.
nav:
  - title: Home
    url: /
  - title: Wiki
    url: /wiki/
  - title: Get involved
    url: /community.html
  - title: Discord
    url: https://discord.gg/63qP3Erw43
  - title: GitHub
    url: https://github.com/Edgemodders
