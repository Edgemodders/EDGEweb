# Builds the docs site and deploys it to GitHub Pages.
#   Jekyll renders docs/ with the HUD layout; the result is deployed to
#   https://edgemodders.ai/ (custom domain, set in Settings > Pages)
# Requires Settings > Pages > Source: GitHub Actions.

name: Docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the dashboard's date is the last commit that changed its data
      - name: Stamp the dashboard with the day its data last changed
        run: |
          printf '{"updated":"%s"}
' "$(git log -1 --format=%cI -- docs/assets/dashboard/status.js)" > docs/assets/dashboard/updated.json
      - uses: actions/configure-pages@v5
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
